services:
  - type: web
    name: taskmaster-api
    runtime: java
    rootDir: backend-taskmaster
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/backend-taskmaster-1.0.0.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 86400000
      - key: FRONTEND_URL
        sync: false
