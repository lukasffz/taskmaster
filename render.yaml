services:
  - type: web
    name: taskmaster-api
    runtime: docker
    rootDir: backend-taskmaster
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 86400000
      - key: FRONTEND_URL
        sync: false
